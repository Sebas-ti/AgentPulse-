[project]
name = "agentpulse-workspace"
version = "0.1.0"
description = "AgentPulse Workspace"
readme = "ARCHITECTURE.md"
requires-python = ">=3.12"
dependencies = [
    "agentpulse-api",
    "agentpulse-sdk",
]

[tool.uv.sources]
agentpulse-api = { workspace = true }
agentpulse-sdk = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pyright>=1.1.385",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/sdk-python",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["B008"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = [
    "apps/api/src",
    "packages/sdk-python/src",
]
include = [
    "apps/api/src",
    "apps/api/tests",
    "packages/sdk-python/src",
    "packages/sdk-python/tests",
]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.venv",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["apps/api/tests", "packages/sdk-python/tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "live: live tests with real external LLM/services",
]
